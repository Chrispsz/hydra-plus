name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - ".github/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:
      - name: Check out Git repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # commitlint --last needs the parent commit

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.21.0
          cache: "yarn"

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Lint
        run: yarn lint

      - name: Commit lint
        run: npx commitlint --last

      - name: Format check
        run: yarn format-check

  # Packaging is validated on Linux only for PRs/pushes — the Windows
  # job is the most expensive runner-minute sink and the release workflow
  # builds both platforms for every tag anyway.
  build:
    needs: quality
    if: github.event_name == 'push'
    uses: ./.github/workflows/reusable-build.yml
    with:
      flavor: ci
      runsOn: '["ubuntu-24.04"]'
    secrets: inherit
