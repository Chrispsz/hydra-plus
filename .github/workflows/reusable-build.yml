name: Reusable Build

on:
  workflow_call:
    inputs:
      flavor:
        description: "Build flavor: ci, release or nightly"
        type: string
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: echo "probe ${{ inputs.flavor }}"
