appId: gg.hydraplus.launcher
productName: Hydra Plus
directories:
  buildResources: build
extraResources:
  - ludusavi
  - hydra-native
  - from: node_modules/create-desktop-shortcuts/src/windows.vbs
files:
  - "!.cache/**"
  - "!native/torrent-bridge/**"
  - "!**/.vscode/*"
  - "!src/*"
  - "!native/hydra-native/target"
  - "!native/hydra-native/target/**"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.test.json}"
  - "!scripts/**"
  - "!binaries/**"
  - "!docs/**"
  - "!native/**"
  - "!.codex/**"
  - "!ludusavi/config.yaml"
  - "!{commitlint.config.js,skills-lock.json,SECURITY.md,CONTRIBUTING.md,.github}"
asarUnpack:
  - resources/**
  - node_modules/sharp/**
  - node_modules/@img/sharp-libvips-*/**
win:
  executableName: HydraPlus
  extraResources:
    - from: binaries/7z.exe
    - from: binaries/7z.dll
  target:
    - portable
portable:
  artifactName: ${name}-${version}-portable.${ext}
  unpackDirName: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: binaries/7zz
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  extraResources:
    - from: binaries/7zzs
    - from: binaries/umu/umu-run
  target:
    - AppImage
  mimeTypes:
    - x-scheme-handler/hydralauncher
appImage:
  artifactName: ${name}-${version}.${ext}
afterPack: ./scripts/after-pack.cjs
npmRebuild: false
publish:
  provider: github
  owner: Chrispsz
  repo: hydra-plus
